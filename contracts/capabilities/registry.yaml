# The registry of capabilities (REQ-CNF-007, section 6 of PR-001). The format of every field and state is in README.md.
#
# Every REQ-* identifier that the specification defines (a bold paragraph start in PR-001) is listed by exactly one
# capability, with its evidence: `tests` (conformance tests that exist) or `pending` (the task that will write the
# test, or `unassigned` when no task mentions it yet). A pending requirement is never counted as covered.
#
# `go run .` in tools/registry_check checks this file; CI runs it (job registry-check). A capability is `supported`
# only when both languages pass its tests (or one is not_applicable, with a reason, and the other passes).
#
# The library is beta as a whole until every capability is stable (REQ-CNF-008, Q09-6): no capability is supported yet.
