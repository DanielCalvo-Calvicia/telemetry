name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  # Lists the Go modules of go.work (the old library at ".", the new core at "./go" and, later, each adapter), so a
  # new module is checked without editing this file.
  modules:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.find.outputs.modules }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go/go.mod
          cache: false
      - id: find
        name: List the Go modules of go.work
        run: echo "modules=$(go work edit -json | jq -c '[.Use[].DiskPath]')" >> "$GITHUB_OUTPUT"

  # One job per Go module: format, vet, build, tests and the coverage gate.
  go:
    needs: modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.modules) }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: false
      - name: Format (gofmt and goimports print nothing)
        run: |
          test -z "$(gofmt -l .)"
          test -z "$(go run golang.org/x/tools/cmd/goimports@v0.35.0 -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -count=1 -coverpkg=./internal/... -coverprofile=coverage.out
      - name: Coverage gate (>= 95%, excluding external/ folders)
        run: |
          grep -v '/external/' coverage.out > filtered.out
          total=$(go tool cover -func=filtered.out | awk '/^total:/ {sub("%","",$3); print $3}')
          echo "coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t >= 95) ? 0 : 1 }'

  # The Python package: lint, format, tests and the same coverage gate, on the minimum version and the one of the
  # Raspberry Pi of the pilot.
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and the development tools
        run: python -m pip install . "coverage[toml]==7.17.0" ruff==0.17.3
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Tests and the coverage gate (>= 95%, excluding external/ folders; the gate is fail_under in pyproject.toml)
        run: |
          coverage run -m unittest discover -s internal/tests -t .
          coverage report

  # The Go and Python implementations run the same fixtures and must agree (REQ-CNF-006). Empty until T-02.8 and T-12.
  cross-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Cross-language fixtures
        run: echo "no cross-language fixture yet (T-02.8 creates the first, T-12 the runner)"
